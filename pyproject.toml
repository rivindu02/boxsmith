[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxsmith"
version = "0.1.0"
description = "Forge detections. Understand every AP point."
requires-python = ">=3.12"
dependencies = ["torch>=2.6", "numpy>=2", "Pillow>=11", "streamlit>=1.45", "plotly>=6", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pycocotools>=2.0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
