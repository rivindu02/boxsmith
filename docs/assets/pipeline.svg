<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="358" viewBox="0 0 1280 358" role="img" aria-labelledby="title description">
  <title id="title">From synthetic scenes to transparent detection metrics</title>
  <desc id="description">Generate seeded scenes, run a tiny CNN, cache decoded candidates, apply class-aware NMS, and match ground truth across evaluation IoUs. Confidence selects a point on the resulting precision-recall curve.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#647b9b"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="1279" height="357" rx="20" fill="#0c1425" stroke="#293c59"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="32" y="40" fill="#f1f5f9" font-size="19" font-weight="700">One forward pass. Many experiments.</text>
    <text x="32" y="65" fill="#9ab1cd" font-size="13">Threshold changes reuse decoded candidates; the CNN does not need retraining.</text>
    <g fill="#131f34" stroke="#304766">
      <rect x="32" y="103" width="208" height="111" rx="12"/>
      <rect x="284" y="103" width="208" height="111" rx="12"/>
      <rect x="536" y="103" width="208" height="111" rx="12"/>
      <rect x="788" y="103" width="208" height="111" rx="12"/>
      <rect x="1040" y="103" width="208" height="111" rx="12"/>
    </g>
    <g fill="none" stroke="#647b9b" stroke-width="2" marker-end="url(#arrow)">
      <path d="M248 158H274"/><path d="M500 158H526"/>
      <path d="M752 158H778"/><path d="M1004 158H1030"/>
    </g>
    <g font-size="11" font-weight="700" letter-spacing="1.5">
      <text x="48" y="128" fill="#34d399">01 / GENERATE</text>
      <text x="300" y="128" fill="#38bdf8">02 / PREDICT</text>
      <text x="552" y="128" fill="#a78bfa">03 / CACHE</text>
      <text x="804" y="128" fill="#fbbf24">04 / SUPPRESS</text>
      <text x="1056" y="128" fill="#fb7185">05 / EVALUATE</text>
    </g>
    <g fill="#edf2f7" font-size="17" font-weight="600">
      <text x="48" y="158">Seeded shapes</text>
      <text x="300" y="158">Tiny CNN</text>
      <text x="552" y="158">Raw candidates</text>
      <text x="804" y="158">Class-aware NMS</text>
      <text x="1056" y="158">PR / AP / mAP</text>
    </g>
    <g fill="#9ab1cd" font-size="12">
      <text x="48" y="183">128 × 128 RGB + true boxes</text>
      <text x="300" y="183">16 × 16 grid · 3 anchors</text>
      <text x="552" y="183">Model hash + split + seed</text>
      <text x="804" y="183">Adjust NMS IoU</text>
      <text x="1056" y="183">Adjust evaluation IoU</text>
    </g>
    <path d="M136 223V247H1144V223" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="5 5"/>
    <rect x="445" y="235" width="390" height="24" rx="12" fill="#0c1425"/>
    <text x="640" y="252" text-anchor="middle" fill="#6ee7b7" font-size="12">Ground-truth boxes go directly to evaluation</text>
    <rect x="32" y="281" width="1216" height="49" rx="10" fill="#132c3b" stroke="#24516a"/>
    <text x="52" y="312" fill="#7dd3fc" font-size="14" font-weight="700">Confidence selects the operating point.</text>
    <text x="400" y="312" fill="#bdd5e7" font-size="14">Reference AP sweeps scores; changing display confidence preserves AP.</text>
  </g>
</svg>
